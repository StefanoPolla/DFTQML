[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dftqml"
version = "0.1.0" # Replace with the version from your VERSION file
description = "A package for learning DFT functionals from quantum-generated data"
readme = "README.md"
authors = [
    { name = "Stefano Polla", email = "polla@lorentz.leidenuniv.nl" },
    { name = "Felix Frohnert", email = "f.frohnert@liacs.leidenuniv.nl" },
    { name = "Emiel Koridon", email = "emielkoridon@hotmail.com" },
]
license = { text = "Apache-2.0" }
keywords = ["DFT", "Quantum", "Machine Learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy",
    "scipy",
    "openfermion>=1.5",
    "cirq-core==1.3.0",
    "scikit-learn==1.4.1.post1",
    "pennylane>=0.31.1",
    "attrs>=23.0.0",
    "pyscf"
]

[project.urls]
Homepage = "https://github.com/StefanoPolla/dftqml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
